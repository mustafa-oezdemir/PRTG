name: E2E tests
on:
  pull_request:
  schedule:
    - cron: '0 11 * * *' #Run e2e tests once a day at 11 UTC

permissions:
  contents: read

jobs:
  resolve-versions:
    name: Resolve Grafana images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@main

  playwright-tests:
    needs: resolve-versions
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install npm dependencies
        run: npm ci

      - name: Install Mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        run: mage -v build:linux

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Grafana
        run: |
          docker compose pull
          GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@main
        with:
          url: http://localhost:3001/login

      - name: Run Playwright tests
        id: run-tests
        run: npx playwright test

      - name: Grafana diagnostics
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
          for endpoint in /api/health /login; do
            echo "Checking http://localhost:3001${endpoint}"
            curl --verbose --max-time 10 "http://localhost:3001${endpoint}" || \
              echo "::warning::Grafana endpoint ${endpoint} was not reachable (curl exit $?)."
          done

      - name: Stop Grafana
        if: ${{ always() }}
        run: docker compose down
