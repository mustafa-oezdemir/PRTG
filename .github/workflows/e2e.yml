name: E2E tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' #Run e2e tests once a day at 11 UTC

permissions:
  contents: read

concurrency:
  group: scheduled-e2e
  cancel-in-progress: true

jobs:
  resolve-versions:
    name: Resolve Grafana images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve supported Grafana versions
        id: resolve-upstream-versions
        uses: grafana/plugin-actions/e2e-version@main

      - name: Use Grafana OSS images
        id: resolve-versions
        env:
          UPSTREAM_MATRIX: ${{ steps.resolve-upstream-versions.outputs.matrix }}
        run: |
          OSS_MATRIX=$(python3 -c 'import json, os; print(json.dumps([{**item, "name": "grafana"} for item in json.loads(os.environ["UPSTREAM_MATRIX"])], separators=(",", ":")))')
          echo "matrix=${OSS_MATRIX}" >> "$GITHUB_OUTPUT"

  playwright-tests:
    needs: resolve-versions
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e OSS ${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install npm dependencies
        run: npm ci

      - name: Install Mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        run: mage -v build:linux

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps

      - name: Start Grafana
        run: |
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@main
        with:
          url: http://localhost:3001/login

      - name: Run Playwright tests
        id: run-tests
        run: npm run e2e
        env:
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: admin

      - name: Upload Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.GRAFANA_IMAGE.NAME }}-${{ matrix.GRAFANA_IMAGE.VERSION }}
          path: |
            playwright-report
            test-results
            tests/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Grafana diagnostics
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
          for endpoint in /api/health /login; do
            echo "Checking http://localhost:3001${endpoint}"
            curl --verbose --max-time 10 "http://localhost:3001${endpoint}" || \
              echo "::warning::Grafana endpoint ${endpoint} was not reachable (curl exit $?)."
          done

      - name: Stop Grafana
        if: ${{ always() }}
        run: docker compose down
