services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      PRTG_PATH: ${PRTG_PATH:-}
      PRTG_API: ${PRTG_API:-}
      PRTG_CACHE_TIME: ${PRTG_CACHE_TIME:-6000}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
